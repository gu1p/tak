[package]
name = "tak-exec"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "suite"
path = "tests/mod.rs"

[lib]
# Cargo rustdoc currently fails to resolve `tak-exec`'s private dependency graph under `cargo test`.
doctest = false

[dependencies]
anyhow.workspace = true
bollard.workspace = true
futures.workspace = true
hex.workspace = true
libc = "0.2"
rusqlite.workspace = true
tokio.workspace = true
tracing.workspace = true
tak-core = { path = "../tak-core" }
tak-proto = { path = "../tak-proto" }
serde.workspace = true
sha2.workspace = true
sysinfo.workspace = true
uuid.workspace = true
tar.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
url.workspace = true
